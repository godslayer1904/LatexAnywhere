<!doctype html>
<html><head><meta charset="utf-8"><title>VAL:</title></head>
<body style="margin:40px;font:16px Segoe UI">
<textarea id="t" rows="6" cols="60" autofocus></textarea>
<script>
// 测试目标：文本框内容实时写进窗口标题，测试脚本读标题即可拿到内容
const t = document.getElementById("t");
const sync = () => { document.title = "VAL:" + t.value.replace(/\n/g, "\n"); };
t.addEventListener("input", sync);
window.setVal = (v) => { t.value = v; sync(); };
document.addEventListener("keydown", (e) => { if (e.key === "F9") { t.value = ""; sync(); } });   // F9：清空
setInterval(sync, 200);
</script></body></html>
